<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LoanFlex</title>
</head>
<body>
    <div class="contanier" id="contanier">
        <input type="text" id="inp1" placeholder="Enter Loan Amount">
        <input type="text" id="inp2" placeholder="Enter Annual Interest Rate">
        <input type="text" id="inp3" placeholder="Enter Loan Term in Years">
        <button id="btn">Calculate Loan</button>
        <h3 id="h3"></h3>
    </div>
    <div id="result">
        <span id="span1"></span>
        <span id="span2"></span>
        <span id="span3"></span>
        <button id="back">Return To Main Menu</button>
    </div>
</body>
<script src="main.js"></script>
</html>
